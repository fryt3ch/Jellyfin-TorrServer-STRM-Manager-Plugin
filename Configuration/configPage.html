<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TorrServer STRM</title></head>
<body>
<div id="TsCfgPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content">
    <div class="content-primary">
      <h2>TorrServer STRM Manager</h2>

      <h3>Settings</h3>
      <form id="TsCfgForm">
        <div class="inputContainer">
          <input is="emby-input" id="TorrServerUrl" type="text" label="TorrServer API URL (from Jellyfin)" />
          <div class="fieldDescription">Must be reachable from the Jellyfin server (in Docker, the container name). For example http://torrserver:8090</div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" id="StreamBaseUrl" type="text" label="Player URL (in .strm, optional)" />
          <div class="fieldDescription">Reachable from clients (TV, phone). Empty = API URL. For example http://192.168.1.10:8090</div>
        </div>
        <div class="inputContainer"><input is="emby-input" id="Username" type="text" label="Username (if authentication is enabled)" /></div>
        <div class="inputContainer"><input is="emby-input" id="Password" type="password" label="Password" /></div>
        <label class="checkboxContainer">
          <input is="emby-checkbox" type="checkbox" id="ScanAfterAdd" />
          <span>Scan libraries after adding</span>
        </label>
        <br />
        <button is="emby-button" type="submit" class="raised button-submit block"><span>Save settings</span></button>
      </form>

      <hr />

      <h3>Tracked files</h3>
      <div class="fieldDescription" id="TrackedSummary">Loading index…</div>
      <div class="inputContainer">
        <input is="emby-input" id="TrackedSearch" type="text" label="Search by title, path, or hash" />
      </div>
      <button is="emby-button" type="button" id="BtnTrackedRefresh" class="raised"><span>Refresh</span></button>
      <div id="TrackedList" style="margin-top:1em;"></div>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = '7c1f3a52-9d4e-4b8a-a6f1-2e5b8c9d0f13';
      var page = document.querySelector('#TsCfgPage');
      var cfgText = ['TorrServerUrl', 'StreamBaseUrl', 'Username', 'Password'];

      page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          cfgText.forEach(function (k) { page.querySelector('#' + k).value = c[k] || ''; });
          page.querySelector('#ScanAfterAdd').checked = !!c.ScanAfterAdd;
          Dashboard.hideLoadingMsg();
        }).catch(function () {
          Dashboard.hideLoadingMsg();
        });
        loadTracked();
      });

      page.querySelector('#TsCfgForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          cfgText.forEach(function (k) { c[k] = page.querySelector('#' + k).value.trim(); });
          c.ScanAfterAdd = page.querySelector('#ScanAfterAdd').checked;
          ApiClient.updatePluginConfiguration(pluginId, c).then(Dashboard.processPluginConfigurationUpdateResult);
        }).catch(function () {
          Dashboard.hideLoadingMsg();
        });
        return false;
      });

      var tracked = null;
      var trackedSearch = page.querySelector('#TrackedSearch');
      var trackedList = page.querySelector('#TrackedList');
      var trackedSummary = page.querySelector('#TrackedSummary');

      function formatDate(value) {
        if (!value) {
          return '—';
        }

        try {
          return new Date(value).toLocaleString();
        } catch (e) {
          return value;
        }
      }

      function matchesTracked(item, term) {
        if (!term) {
          return true;
        }

        var haystack = [item.title || '', item.rootPath || '', item.libraryRoot || ''];
        (item.files || []).forEach(function (file) {
          haystack.push(file.path || '', file.hash || '');
        });

        return haystack.join('\n').toLowerCase().indexOf(term) >= 0;
      }

      function renderTracked() {
        var term = trackedSearch.value.trim().toLowerCase();
        trackedList.textContent = '';

        if (!tracked) {
          return;
        }

        var items = (tracked.items || []).filter(function (item) {
          return matchesTracked(item, term);
        });
        var totalFiles = items.reduce(function (sum, item) {
          return sum + (item.files ? item.files.length : 0);
        }, 0);
        var missing = items.reduce(function (sum, item) {
          return sum + (item.files || []).filter(function (file) { return !file.exists; }).length;
        }, 0);

        trackedSummary.textContent = 'Items: ' + items.length
          + ' · Files: ' + totalFiles
          + ' · Missing on disk: ' + missing
          + ' · Index: ' + formatDate(tracked.loadedAt);

        if (!items.length) {
          var empty = document.createElement('div');
          empty.className = 'fieldDescription';
          empty.textContent = tracked.items && tracked.items.length
            ? 'Nothing found.'
            : 'No tracked files.';
          trackedList.appendChild(empty);
          return;
        }

        items.forEach(function (item) {
          var details = document.createElement('details');
          details.style.marginBottom = '0.75em';

          var summary = document.createElement('summary');
          var title = item.title || '(untitled)';
          if (item.year) {
            title += ' (' + item.year + ')';
          }

          var kind = item.type === 'series' ? 'Series' : 'Movie';
          summary.textContent = kind + ': ' + title + ' — ' + (item.files ? item.files.length : 0) + ' file(s)';
          details.appendChild(summary);

          var list = document.createElement('ul');
          list.style.marginTop = '0.5em';
          (item.files || []).forEach(function (file) {
            var li = document.createElement('li');
            li.style.marginBottom = '0.35em';

            var path = document.createElement('code');
            path.textContent = file.path || '';
            li.appendChild(path);

            var hash = document.createElement('div');
            hash.className = 'fieldDescription';
            hash.textContent = 'hash: ' + (file.hash || '');
            if (!file.exists) {
              hash.textContent += ' · file missing';
              hash.style.color = '#cc0000';
            }

            li.appendChild(hash);
            list.appendChild(li);
          });

          details.appendChild(list);
          trackedList.appendChild(details);
        });
      }

      function loadTracked() {
        trackedSummary.textContent = 'Loading index…';
        trackedList.textContent = '';
        ApiClient.ajax({
          type: 'GET',
          url: ApiClient.getUrl('TorrServerStrm/Tracked'),
          dataType: 'json'
        }).then(function (r) {
          tracked = r;
          renderTracked();
        }).catch(function () {
          tracked = null;
          trackedSummary.textContent = 'Failed to load the tracked files list.';
        });
      }

      trackedSearch.addEventListener('input', renderTracked);
      page.querySelector('#BtnTrackedRefresh').addEventListener('click', loadTracked);
    })();
  </script>
</div>
</body>
</html>
